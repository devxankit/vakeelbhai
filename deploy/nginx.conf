# Vakeel Bhai: nginx site. Copy to /etc/nginx/sites-available/vakeelbhai, replace
# vakeelbhai.com with the real domain, enable it, then run certbot (deploy/README.md).
#
#   vakeelbhai.com / www   website + client and advocate portals + /admin (static, built by Vite)
#                          /api and /socket.io  → the API on 127.0.0.1:5000 (same origin: the
#                          website's login cookies stay SameSite=Strict and no CORS is needed)
#   api.vakeelbhai.com     the same API for the mobile app

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream vakeelbhai_api {
  server 127.0.0.1:5000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name vakeelbhai.com www.vakeelbhai.com api.vakeelbhai.com;
  # certbot adds the redirect to HTTPS here
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name vakeelbhai.com www.vakeelbhai.com;

  # ssl_certificate / ssl_certificate_key: added by certbot

  root /srv/vakeelbhai/frontend/dist;
  index index.html;

  # Photos and documents (max 5 MB each in the API) plus form overhead
  client_max_body_size 6m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/csv;

  location /api/ {
    proxy_pass http://vakeelbhai_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  location /socket.io/ {
    proxy_pass http://vakeelbhai_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # Built files have a content hash in the name: cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: every other path serves index.html (never cached, so updates show at once).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.vakeelbhai.com;

  # ssl_certificate / ssl_certificate_key: added by certbot

  client_max_body_size 6m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /socket.io/ {
    proxy_pass http://vakeelbhai_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://vakeelbhai_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }
}
